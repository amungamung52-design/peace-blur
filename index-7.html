<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peace Blur</title>
<style>
html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:Arial}body{overflow:hidden}#app{position:relative;width:100vw;height:100vh}video,#blur{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#blur{filter:blur(25px);opacity:0;transition:.25s}canvas{position:absolute;inset:0;width:100%;height:100%}.ui{position:absolute;z-index:3;width:100%;text-align:center}#top{top:18px}#status{background:#000b;padding:9px 14px;border-radius:30px;font-size:13px}#center{top:43%;font-size:27px;font-weight:bold;text-shadow:0 2px 10px #000}#sub{font-size:13px;opacity:.7;margin-top:8px}#bottom{bottom:25px}button{padding:14px 20px;border:0;border-radius:14px;font-weight:bold}#msg{font-size:12px;opacity:.7;margin-top:10px}
</style></head>
<body><div id="app">
<video id="video" autoplay playsinline muted></video><video id="blur" autoplay playsinline muted></video><canvas id="canvas"></canvas>
<div id="top" class="ui"><span id="status">Memuat AI...</span></div>
<div id="center" class="ui">✌️ Peace Blur<div id="sub">Angkat telunjuk + jari tengah</div></div>
<div id="bottom" class="ui"><button id="start" disabled>MEMUAT AI...</button><div id="msg"></div></div>
</div>
<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";
const v=document.getElementById("video"),b=document.getElementById("blur"),c=document.getElementById("canvas"),x=c.getContext("2d"),s=document.getElementById("start"),st=document.getElementById("status"),m=document.getElementById("msg");
let d,last=-1;
function resize(){c.width=innerWidth;c.height=innerHeight}resize();onresize=resize;
function up(a,t,p){return a[t].y<a[p].y}function isPeace(a){return up(a,8,6)&&up(a,12,10)&&!up(a,16,14)&&!up(a,20,18)}
function draw(a,on){x.clearRect(0,0,c.width,c.height);x.strokeStyle=on?"white":"#55ddff";x.fillStyle=x.strokeStyle;x.lineWidth=3;let q=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];for(let [i,j] of q){x.beginPath();x.moveTo(c.width-a[i].x*c.width,a[i].y*c.height);x.lineTo(c.width-a[j].x*c.width,a[j].y*c.height);x.stroke()}for(let p of a){x.beginPath();x.arc(c.width-p.x*c.width,p.y*c.height,4,0,7);x.fill()}}
async function setup(){try{let f=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");d=await HandLandmarker.createFromOptions(f,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},runningMode:"VIDEO",numHands:1});st.textContent="AI SIAP";s.textContent="AKTIFKAN KAMERA";s.disabled=false}catch(e){st.textContent="AI GAGAL";m.textContent="Refresh dan pastikan internet aktif."}}
async function camera(){try{let z=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});v.srcObject=z;b.srcObject=z;await v.play();await b.play();s.style.display="none";requestAnimationFrame(loop)}catch(e){m.textContent="Izinkan kamera Chrome lalu refresh."}}
function loop(){if(d&&v.readyState>=2&&v.currentTime!==last){last=v.currentTime;let r=d.detectForVideo(v,performance.now()),p=false;if(r.landmarks?.length){p=isPeace(r.landmarks[0]);draw(r.landmarks[0],p)}else x.clearRect(0,0,c.width,c.height);b.style.opacity=p?"1":"0";st.textContent=p?"✌️ PEACE — BLUR ON":"KAMERA AKTIF"}requestAnimationFrame(loop)}
s.onclick=camera;setup();
</script></body></html>
